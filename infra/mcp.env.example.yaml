# Separate PRIVATE IAM-protected service; never deploy this with --allow-unauthenticated.
# Copy to mcp.local.yaml, fill every placeholder, keep it out of Git.
AUTH_MODE: "firebase"
STORE: "firestore"
GOOGLE_CLOUD_PROJECT: "REPLACE_PROJECT_ID"
MCP_ONLY: "true"
MCP_TRUST_CLOUD_RUN_IAM: "true"
MCP_AUDIENCE: "https://REPLACE_PRIVATE_MCP_SERVICE.run.app"
MCP_EMAILS_JSON: '{"service-REPLACE_GE_PROJECT_NUMBER@gcp-sa-discoveryengine.iam.gserviceaccount.com":"bowl-lab"}'
ALLOWED_ORIGINS: "https://vertexaisearch.cloud.google.com"
